[custom]
; ==========================================================
; OpenClash 优化版 V3
; 目标：国内直连、海外应用分流、减少共享 IP 误判
; 注意：本配置为 custom 规则生成器格式
; ==========================================================

enable_rule_generator=true
overwrite_original_rules=true


; ==========================================================
; 0. 节点清洗
; 尽量排除机场说明、流量提示和失效通知节点
; 不使用过短的 TG 关键词，降低误删正常节点的风险
; ==========================================================

exclude=流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|官网地址|公告|通知|Telegram|电报|群|频道|说明|使用说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official|Website


; ==========================================================
; 1. 规则列表
; 按照从上到下的优先级排列
; ==========================================================

; ----------------------------------------------------------
; 1.1 私网和局域网直连
; ----------------------------------------------------------

ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve


; ----------------------------------------------------------
; 1.2 自定义国内直连规则
; ----------------------------------------------------------

;ruleset=DIRECT,[]GEOSITE,wechat
;ruleset=DIRECT,[]GEOSITE,qq

; 自定义直连名单
ruleset=DIRECT,https://raw.githubusercontent.com/oiioaaron/fenliu-openclash/main/Direct.list

; 自定义直连域名规则
ruleset=DIRECT,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml,28800

; 自定义直连 IP 规则
ruleset=DIRECT,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800


; ----------------------------------------------------------
; 1.3 明确的海外应用分流
; 优先于宽泛的海外服务分类
; ----------------------------------------------------------

; Adobe
ruleset=🟥 Adobe,[]GEOSITE,adobe

; ChatGPT / OpenAI
ruleset=🤖 ChatGPT,[]GEOSITE,openai

; Gemini
ruleset=♊ Gemini,clash-domain:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.yaml,86400

; 其他 AI 服务
ruleset=🧠 AI,https://raw.githubusercontent.com/oiioaaron/fenliu-openclash/main/AI.list
ruleset=🧠 AI,[]GEOSITE,category-ai-!cn

; YouTube
ruleset=🎬 YouTube,[]GEOSITE,youtube

; Netflix
ruleset=🎥 Netflix,[]GEOSITE,netflix

; TikTok
ruleset=🎵 TikTok,[]GEOSITE,tiktok

; Facebook
ruleset=👥 Facebook,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Facebook/Facebook.list

; Instagram
ruleset=📸 Instagram,[]GEOSITE,instagram

; GitHub
ruleset=🧑‍💻 GitHub,[]GEOSITE,github

; TeamViewer
ruleset=↔️ teamviewer,[]GEOSITE,teamviewer


; ----------------------------------------------------------
; 1.4 国际生态及常见厂商
; 先处理本土化服务，再处理厂商通用分类
; ----------------------------------------------------------

; Google 国内服务
ruleset=DIRECT,[]GEOSITE,google-cn

; Apple 国内服务
ruleset=DIRECT,[]GEOSITE,apple-cn

; Apple 国际服务
ruleset=🍎 Apple,[]GEOSITE,apple

; Google 国际服务
ruleset=🔎 Google,[]GEOSITE,google

; Microsoft 服务
ruleset=🪟 Microsoft,[]GEOSITE,microsoft


; ----------------------------------------------------------
; 1.5 海外社交媒体
; ----------------------------------------------------------

ruleset=💬 社交媒体,[]GEOSITE,category-social-media-!cn


; ----------------------------------------------------------
; 1.6 国内下载、游戏平台和测速
; ----------------------------------------------------------

ruleset=DIRECT,[]GEOSITE,category-games@cn
ruleset=DIRECT,[]GEOSITE,category-game-platforms-download
ruleset=DIRECT,[]GEOSITE,category-public-tracker

ruleset=🚝 测速工具,[]GEOSITE,category-speedtest


; ----------------------------------------------------------
; 1.7 自定义代理规则及 GFW 规则
; 注意：应位于国内兜底之前
; ----------------------------------------------------------

ruleset=🚀 手动选择,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.yaml,28800

ruleset=🚀 手动选择,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,28800

ruleset=🚀 手动选择,[]GEOSITE,gfw


; ----------------------------------------------------------
; 1.8 国内域名和 IP 兜底
; 国内域名优先，国内 IP 作为补充
; ----------------------------------------------------------

ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOIP,cn


; ----------------------------------------------------------
; 1.9 Cloudflare 域名分流
; 不再按 Cloudflare IP 所属地统一分流
; 以减少共享 CDN IP 导致的误判
; ----------------------------------------------------------

ruleset=☁️ cloudflare,[]GEOSITE,cloudflare


; ----------------------------------------------------------
; 1.10 非标端口直连
; 仅在前面规则均未命中时生效
; 请核对自定义端口规则的实际内容
; ----------------------------------------------------------

ruleset=DIRECT,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,28800


; ----------------------------------------------------------
; 1.11 最终兜底
; 所有未命中的流量进入 Default
; ----------------------------------------------------------

ruleset=🌐 Default,[]FINAL


; ==========================================================
; 2. 应用策略组
; ==========================================================

; ----------------------------------------------------------
; 2.1 AI 服务
; ----------------------------------------------------------

custom_proxy_group=🤖 ChatGPT`select`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇺🇸 US AI`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default

custom_proxy_group=♊ Gemini`select`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇺🇸 US AI`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]DIRECT`[]🌐 Default

custom_proxy_group=🧠 AI`select`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇺🇸 US AI`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default


; ----------------------------------------------------------
; 2.2 Apple、社交和远程连接
; ----------------------------------------------------------

custom_proxy_group=🍎 Apple`select`[]DIRECT`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default

custom_proxy_group=💬 社交媒体`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default

custom_proxy_group=↔️ teamviewer`select`[]DIRECT`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default


; ----------------------------------------------------------
; 2.3 视频服务
; ----------------------------------------------------------

custom_proxy_group=🎬 YouTube`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default

custom_proxy_group=🎥 Netflix`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default

custom_proxy_group=🎵 TikTok`select`[]🇺🇸 US`[]🇯🇵 JP`[]🇸🇬 SG`[]🇹🇼 TW`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default

custom_proxy_group=👥 Facebook`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default

custom_proxy_group=📸 Instagram`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default


; ----------------------------------------------------------
; 2.4 开发与下载服务
; ----------------------------------------------------------

custom_proxy_group=🧑‍💻 GitHub`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default

custom_proxy_group=🚝 测速工具`select`[]DIRECT`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default


; ----------------------------------------------------------
; 2.5 Adobe
; ----------------------------------------------------------

custom_proxy_group=🟥 Adobe`select`[]DIRECT`[]REJECT`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default


; ----------------------------------------------------------
; 2.6 Google、Cloudflare、Microsoft
; ----------------------------------------------------------

custom_proxy_group=🔎 Google`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default

custom_proxy_group=☁️ cloudflare`select`[]DIRECT`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default

custom_proxy_group=🪟 Microsoft`select`[]DIRECT`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]♻️ 自动选择`[]🧭 手动选择`[]🌐 Default


; ==========================================================
; 3. 基础代理策略组
; ==========================================================

; ----------------------------------------------------------
; 3.1 手动代理备用池
; ----------------------------------------------------------

custom_proxy_group=🚀 手动选择`select`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]DIRECT


; ----------------------------------------------------------
; 3.2 最终兜底组
; 自动选择优先，保留各地区和 DIRECT 作为备选
; ----------------------------------------------------------

custom_proxy_group=🌐 Default`select`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]DIRECT


; ==========================================================
; 4. 节点选择与测速
; ==========================================================

; ----------------------------------------------------------
; 4.1 手动节点组
; 排除常见机场信息节点
; ----------------------------------------------------------

custom_proxy_group=🧭 手动选择`select`^(?!.*(流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|公告|通知|Telegram|电报|群|频道|说明|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official|Website)).*$


; ----------------------------------------------------------
; 4.2 自动测速组
; ----------------------------------------------------------

custom_proxy_group=♻️ 自动选择`url-test`^(?!.*(流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|公告|通知|Telegram|电报|群|频道|说明|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official|Website)).*$`https://www.gstatic.com/generate_204`300,,50


; ----------------------------------------------------------
; 4.3 香港节点
; ----------------------------------------------------------

custom_proxy_group=🇭🇰 HK`url-test`(?i)(🇭🇰|香港|香港节点|(^|[^A-Za-z])HK([^A-Za-z]|$)|hong.?kong)`https://www.gstatic.com/generate_204`300,,50


; ----------------------------------------------------------
; 4.4 台湾节点
; ----------------------------------------------------------

custom_proxy_group=🇹🇼 TW`url-test`(?i)(🇹🇼|台湾|台灣|(^|[^A-Za-z])TW([^A-Za-z]|$)|taiwan|taipei|hinet)`https://www.gstatic.com/generate_204`300,,50


; ----------------------------------------------------------
; 4.5 日本节点
; ----------------------------------------------------------

custom_proxy_group=🇯🇵 JP`url-test`(?i)(🇯🇵|日本|(^|[^A-Za-z])JP([^A-Za-z]|$)|tokyo|osaka)`https://www.gstatic.com/generate_204`300,,50


; ----------------------------------------------------------
; 4.6 新加坡节点
; ----------------------------------------------------------

custom_proxy_group=🇸🇬 SG`url-test`(?i)(🇸🇬|新加坡|(^|[^A-Za-z])SG([^A-Za-z]|$)|singapore)`https://www.gstatic.com/generate_204`300,,50


; ----------------------------------------------------------
; 4.7 美国节点
; ----------------------------------------------------------

custom_proxy_group=🇺🇸 US`url-test`(?i)(🇺🇸|美国|(^|[^A-Za-z])US([^A-Za-z]|$)|united states|los angeles|san jose|seattle|new york)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇸 US AI`url-test`(?i)(?=.*(🇺🇸|美国|(^|[^A-Za-z])US([^A-Za-z]|$)|united states|los angeles|san jose|seattle|new york))(?=.*(ai|chatgpt|gpt|openai|claude|解锁|isp))`https://www.gstatic.com/generate_204`300,,50

; ----------------------------------------------------------
; 4.8 冷门节点池
; 排除五大主流地区和常见机场信息节点
; ----------------------------------------------------------

custom_proxy_group=🧊 冷门节点`select`^(?!.*(🇭🇰|香港|Hong.?Kong|(^|[^A-Za-z])HK([^A-Za-z]|$)|🇯🇵|日本|Tokyo|Osaka|(^|[^A-Za-z])JP([^A-Za-z]|$)|🇹🇼|台湾|台灣|Taiwan|Taipei|Hinet|(^|[^A-Za-z])TW([^A-Za-z]|$)|🇸🇬|新加坡|Singapore|(^|[^A-Za-z])SG([^A-Za-z]|$)|🇺🇸|美国|United States|Los Angeles|San Jose|Seattle|New York|(^|[^A-Za-z])US([^A-Za-z]|$)|流量|套餐|到期|剩余|重置|官网|网站|防失联|失联|公告|通知|Telegram|电报|频道|说明|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official|Website)).*$
